<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mini Calculatrice</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
        }

        .calculator {
            width: 360px;
            padding: 25px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .color-btn {
            width: 100%;
            margin-bottom: 20px;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: #8e44ad;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .color-btn:hover {
            background: #732d91;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            color: #555;
            font-weight: bold;
        }

        .input-group input,
        #r {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 18px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #6a11cb;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .buttons input {
            padding: 13px 5px;
            border: none;
            border-radius: 10px;
            background: #6a11cb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .buttons input:hover {
            background: #4f0c99;
            transform: translateY(-2px);
        }

        .reset {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #e74c3c;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .reset:hover {
            background: #c0392b;
        }

        .result {
            margin-top: 20px;
        }

        .result label {
            display: block;
            margin-bottom: 7px;
            color: #555;
            font-weight: bold;
        }

        #r {
            background: #f1f1f1;
            color: #222;
            font-weight: bold;
        }
    </style>
</head>

<body>

<form class="calculator">

    <button type="button" class="color-btn" onclick="setbg('violet')">
        🎨 Couleur violet
    </button>

    <h2>🧮 Mini Calculatrice</h2>

    <div class="input-group">
        <label for="a">Nombre 1</label>
        <input type="number" id="a" placeholder="Entrez le premier nombre">
    </div>

    <div class="input-group">
        <label for="b">Nombre 2</label>
        <input type="number" id="b" placeholder="Entrez le deuxième nombre">
    </div>

    <div class="buttons">
        <input type="button" value="+" onclick="somme()">
        <input type="button" value="−" onclick="soustraction()">
        <input type="button" value="×" onclick="produit()">
        <input type="button" value="÷" onclick="div()">
        <input type="button" value="MAX" onclick="maximum()">
        <input type="button" value="MIN" onclick="minimum()">
        <input type="button" value="xʸ" onclick="puissance()">
    </div>

    <input type="reset" class="reset" value="Réinitialiser">

    <div class="result">
        <label for="r">Résultat</label>
        <input type="text" id="r" disabled>
    </div>

</form>


<script>
    function setbg(col) {
        document.body.style.backgroundColor = col;
        document.body.style.backgroundImage = "none";
    }

    function somme() {
        let a = Number(document.getElementById("a").value);
        let b = Number(document.getElementById("b").value);
        document.getElementById("r").value = a + b;
    }

    function soustraction() {
        let a = Number(document.getElementById("a").value);
        let b = Number(document.getElementById("b").value);
        document.getElementById("r").value = a - b;
    }

    function produit() {
        let a = Number(document.getElementById("a").value);
        let b = Number(document.getElementById("b").value);
        document.getElementById("r").value = a * b;
    }

    function div() {
        let a = Number(document.getElementById("a").value);
        let b = Number(document.getElementById("b").value);

        if (b == 0) {
            alert("Impossible de diviser par zéro");
        } else {
            document.getElementById("r").value = a / b;
        }
    }

    function minimum() {
        let a = Number(document.getElementById("a").value);
        let b = Number(document.getElementById("b").value);

        document.getElementById("r").value = Math.min(a, b);
    }

    function maximum() {
        let a = Number(document.getElementById("a").value);
        let b = Number(document.getElementById("b").value);

        document.getElementById("r").value = Math.max(a, b);
    }

    function puissance() {
        let a = Number(document.getElementById("a").value);
        let b = Number(document.getElementById("b").value);

        document.getElementById("r").value = Math.pow(a, b);
    }
</script>

</body>
</html>
